<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Abrir Solicitações</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background-color: #1976d2;
            color: white;
        }
        button:hover {
            background-color: #125ca1;
        }
    </style>
</head>
<body>
    <button onclick="abrirSolicitacoes()">
        Abrir Solicitações
    </button>
    <script>
        function abrirSolicitacoes() {
            window.location.href = "solicitacoes-local://abrir";
        }
    </script>
</body>
</html>
